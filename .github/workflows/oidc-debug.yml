name: OIDC Debug

on:
  workflow_dispatch:

  push:
    branches:
      - feature/**

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Print GitHub OIDC Claims
        shell: bash
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          echo "===================="
          echo "OIDC TOKEN CLAIMS"
          echo "===================="

          echo "$TOKEN" \
            | cut -d "." -f2 \
            | tr '_-' '/+' \
            | base64 -d \
            | jq .
