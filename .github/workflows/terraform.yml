name: Terraform

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main
      - feature/**

permissions:
  id-token: write
  contents: read

jobs:
  terraform:

    environment: production

    runs-on: ubuntu-latest

    env:
      TF_VAR_aws_region: ${{ vars.TF_VAR_AWS_REGION }}
      TF_VAR_allowed_ssh_cidrs: ${{ vars.TF_VAR_ALLOWED_SSH_CIDRS }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::133644693386:role/crystal-github-actions-role
          role-session-name: github-actions
          mask-aws-account-id: false

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Print TF Environment
        run: |
          echo "===== TF Variables ====="
          env | sort | grep TF_VAR || true
          echo "========================"

      - name: Terraform Init
        working-directory: terraform/production/networking
        run: |
          terraform init \
            -backend-config="bucket=crystal-tfstate-987654321" \
            -backend-config="key=production/networking/terraform.tfstate" \
            -backend-config="region=ap-south-1"

      - name: Terraform Validate
        working-directory: terraform/production/networking
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/production/networking
        run: terraform plan -input=false
